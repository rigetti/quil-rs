[workspace]
default-members = ["quil-rs"]
members = ["quil-cli", "quil-rs"]
resolver = "2"

[workspace.dependencies]
clap = { version = "4.5.4", features = ["derive"] }
anyhow = "1.0.103"
approx = "0.5.1"
criterion = "0.5.1"
derive-where = "1.6.0"
derive_more = "2.0.1"
dot-writer = "0.1.2"
indexmap = "2.10.0"
insta = "1.37.0"
internment = { version = "0.8.6", default-features = false }
itertools = "0.14.0"
lexical = "7.0.5"
ndarray = "0.17.1"
nom = "7.1.1"
nom_locate = "4.0.0"
num-complex = "0.4.6"
numpy = "0.29"
once_cell = "1.17.1"
optipy = "0.1.0"
pastey = "0.2"
petgraph = "0.6.4"
pretty_assertions = "1.4.0"
proptest = "1.0.0"
proptest-derive = "0.5.1"
pyo3 = "0.29"
pyo3-build-config = "0.29"
pyo3-stub-gen = "0.23.0"
quil-rs = { version = "0.37.1", path = "quil-rs" }
rand = "0.8.5"
rasciigraph = "0.2.0"
regex = "1.7.1"
rigetti-pyo3 = "0.7.1"
rstest = "0.18.2"
serde = "1.0.125"
statrs = "0.19.1"
strum = "0.26.0"
thiserror = "1.0.56"

[profile.release]
lto = true
codegen-units = 1
