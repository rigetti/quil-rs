name: Publish quil documentation

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

jobs:
  publish-docs:
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: '3.13'
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-make
      - uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: abatilo/actions-poetry@v4

      - name: Build quil-py documentation
        run: cargo make --cwd quil-rs document-quil

      - name: Build quil-plotting documentation
        run: |
          uv tool install maturin
          maturin build --features python --out "$RUNNER_TEMP/wheels" --manifest-path quil-rs/Cargo.toml
          pip install "$RUNNER_TEMP"/wheels/*.whl
          pip install './quil-plotting[docs]'
          sphinx-build quil-plotting/docs quil-rs/build/docs/plotting

      - name: Deploy preview
        if: ${{ github.event_name == 'pull_request' }}
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: quil-rs/build/docs
          preview-branch: quil-py-docs

      - name: Deploy docs
        if: ${{ github.event_name == 'push' }}
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: quil-rs/build/docs
          publish_branch: quil-py-docs
